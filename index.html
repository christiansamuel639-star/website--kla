function itemsUI(){return`<datalist id="sl2">${Object.values(inv().m).map(x=>`<option value="${esc(x.n)}">`).join('')}</datalist><div class="tw"><table><thead><tr><th>Nama Barang</th><th class="n">Harga</th><th class="n">Diskon/unit</th><th class="n">Qty</th><th class="n">Jumlah</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><button class="btn g sm" style="margin:10px 0" onclick="D.items.push({name:'',price:0,qty:1,disc:0});rows()">+ Tambah Barang</button><div class="tot card" id="tt"></div>`}

V.buy=()=>{const ppn=T!='non';if(!D.items)D={date:td(),ppn,items:[{name:'',price:0,qty:1,disc:0}],bp:nextNo(ppn?'P':'N',db.buy.filter(b=>b.bp[0]==(ppn?'P':'N')),'bp')};setTimeout(rows,0);

<div class="card"><div class="f"><div><label>Tanggal</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div><div><label>No. BP (otomatis)</label>${val('x1','bp')}</div><div><label>Supplier</label><select onchange="D.sup=this.value;poPick()">${sopt(D.sup)}</select></div><div><label>No. Faktur</label>${val('x2','inv')}</div>${ppn?`<div><label>No. Faktur Pajak</label>${val('x3','taxinv')}</div>`:''}<div><label>No. PO (opsional)</label><input list="pl" value="${D.po||''}" oninput="D.po=this.value;poPick()"><datalist id="pl">${db.po.map(p=>`<option value="${p.no}">`).join('')}</datalist></div></div>
<div class="row" style="margin-bottom:12px"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" onchange="D.cash=this.checked"> Pembelian Tunai (tidak jadi hutang)</label></div>${itemsUI()}<button class="btn" onclick="saveBuy()">💾 Simpan Pembelian</button></div>`+hist(['Tanggal','No. BP','Faktur','Supplier','Jenis','#Total','Aksi'],db.buy.slice().reverse().map(b=>`<tr><td>${fd(b.date)}</td><td>${b.bp}</td><td>${b.inv}</td><td>${sn(b.sup)}</td><td><span class="badge ${b.ppn?'b1':'b2'}">${b.ppn?'PPN':'Non-PPN'}</span></td><td class="n">${fmt(tot(b))}</td><td><button class="btn r sm" onclick="del('buy','bp','${b.bp}')">Hapus</button></td></tr>`).join(''))};
function poPick(){const p=db.po.find(x=>x.no==D.po&&x.sup==D.sup);if(p&&confirm('Muat barang dari PO '+p.no+'?')){D.items=JSON.parse(JSON.stringify(p.items));rows()}}
function saveBuy(){if(!D.sup)return toast('⚠️ Pilih supplier');if(!D.inv)return toast('⚠️ Isi No. Faktur');const it=D.items.filter(i=>i.name&&i.qty>0);if(!it.length)return toast('⚠️ Isi minimal 1 barang');
db.buy.push({bp:D.bp,date:D.date,inv:D.inv,taxinv:D.taxinv||'',po:D.po||'',sup:+D.sup,ppn:!!D.ppn,rate:D.ppn?db.rate:0,cash:!!D.cash,items:it});save();toast('✅ Pembelian tersimpan');go('buy',T)}
/* RETUR: tanpa No.BP & PO -> No. Faktur Pembelian + Tgl Faktur */
V.ret=()=>{if(!D.items)D={date:td(),items:[{name:'',price:0,qty:1,disc:0}],no:nextNo('R',db.ret,'no'),ppn:false};setTimeout(rows,0);
return`<div class="tip">ℹ️ Retur tidak memakai No. BP dan PO. Pilih <b>No. Faktur Pembelian</b> — tanggal faktur & barang terisi otomatis, lalu ubah Qty yang diretur.</div>
<div class="card"><div class="f"><div><label>Tanggal Retur</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div><div><label>No. Retur</label>${val('x1','no')}</div><div><label>Supplier</label><select onchange="D.sup=this.value;render()">${sopt(D.sup)}</select></div>
<div><label>No. Faktur Pembelian</label><input list="fl" value="${D.inv||''}" oninput="D.inv=this.value;invPick()"><datalist id="fl">${db.buy.filter(b=>!D.sup||b.sup==D.sup).map(b=>`<option value="${b.inv}">`).join('')}</datalist></div>
<div><label>Tgl Faktur Pembelian</label><input type="date" id="rd" value="${D.invDate||''}" onchange="D.invDate=this.value"></div></div>
<div class="row" style="margin-bottom:12px"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${D.ppn?'checked':''} onchange="D.ppn=this.checked;calc()"> Faktur ini kena PPN</label></div>${itemsUI()}<button class="btn" onclick="saveRet()">💾 Simpan Retur</button></div>`+hist(['Tanggal','No. Retur','Supplier','Faktur Beli','Tgl Faktur','#Total','Aksi'],db.ret.slice().reverse().map(r=>`<tr><td>${fd(r.date)}</td><td>${r.no}</td><td>${sn(r.sup)}</td><td>${r.inv}</td><td>${fd(r.invDate)}</td><td class="n">${fmt(tot(r))}</td><td><button class="btn r sm" onclick="del('ret','no','${r.no}')">Hapus</button></td></tr>`).join(''))};
function invPick(){const b=db.buy.find(x=>x.inv==D.inv&&(!D.sup||x.sup==D.sup));if(b){D.sup=b.sup;D.invDate=b.date;D.ppn=b.ppn;D.items=JSON.parse(JSON.stringify(b.items));toast('Faktur ditemukan, barang dimuat');render()}}

db.ret.push({no:D.no,date:D.date,sup:+D.sup,inv:D.inv,invDate:D.invDate,ppn:!!D.ppn,rate:db.rate,items:it});save();toast('✅ Retur tersimpan');go('ret')}
/* BAYAR */
V.pay=()=>{if(!D.date)D={date:td(),type:'Transfer',no:nextNo('KK',db.pay,'no'),amt:{}};const bs=db.buy.filter(b=>b.sup==D.sup&&out(b)>0);
return`<div class="card"><div class="f"><div><label>Supplier</label><select onchange="D.sup=this.value;D.amt={};render()">${sopt(D.sup)}</select></div><div><label>Tanggal Pembayaran</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div><div><label>Jenis Pembayaran</label><select onchange="D.type=this.value">${['Tunai','Giro/Cek','Transfer'].map(t=>`<option ${t==D.type?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Buku Bank</label><select onchange="D.bank=this.value"><option value="">Kas / —</option>${['BCA','Mandiri','BNI','BRI'].map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>No. Bukti Pengeluaran Kas/Bank</label><input value="${D.no}" oninput="D.no=this.value"></div></div>
${D.sup?list(['Tanggal','No. BP','No. Faktur','Jenis','#Sisa Tagihan','#Jumlah Pembayaran',''],bs.map(b=>`<tr><td>${fd(b.date)}</td><td>${b.bp}</td><td>${b.inv}</td><td><span class="badge ${b.ppn?'b1':'b2'}">${b.ppn?'PPN':'Non-PPN'}</span></td><td class="n">${fmt(out(b))}</td><td><input type="number" id="a_${b.bp}" style="text-align:right" value="${D.amt[b.bp]||''}" oninput="D.amt['${b.bp}']=+this.value;pt()"></td><td><button class="btn g sm" onclick="D.amt['${b.bp}']=${out(b)};$('#a_${b.bp}').value=${out(b)};pt()">Lunas</button></td></tr>`).join('')):'<div class="tip">Pilih supplier untuk menampilkan tagihan yang belum lunas.</div>'}
<div class="row" style="margin-top:14px"><b>Total Pembayaran: Rp <span id="pt">0</span></b><button class="btn" style="margin-left:auto" onclick="savePay()">💾 Simpan Pembayaran</button></div></div>`+hist(['Tanggal','No. Bukti','Supplier','Jenis','#Jumlah'],db.pay.slice().reverse().map(p=>`<tr><td>${fd(p.date)}</td><td>${p.no}</td><td>${sn(p.sup)}</td><td>${p.type}${p.bank?' - '+p.bank:''}</td><td class="n">${fmt(p.lines.reduce((a,l)=>a+l.amt,0))}</td></tr>`).join(''))};
const pt=()=>$('#pt').textContent=fmt(Object.values(D.amt).reduce((a,b)=>a+(b||0),0));
function savePay(){const ls=Object.entries(D.amt).filter(x=>x[1]>0).map(x=>({bp:x[0],amt:x[1]}));if(!D.sup||!ls.length)return toast('⚠️ Isi jumlah pembayaran');

db.pay.push({no:D.no,date:D.date,sup:+D.sup,type:D.type,bank:D.bank||'',bukti:D.no,lines:ls});save();toast('✅ Pembayaran tersimpan');go('pay')}
/* LAPORAN PEMBELIAN */
V.rb=()=>{setTimeout(rbRes,0);const m=td().slice(0,7);return`<div class="card noprint"><div class="f"><div><label>Supplier</label><select id="r1">${sopt('',1)}</select></div><div><label>Dari Tanggal</label><input type="date" id="r2" value="${m}-01"></div><div><label>Sampai Tanggal</label><input type="date" id="r3" value="${td()}"></div><div><label>Jenis</label><select id="r4"><option value="">Semua</option><option value="1">PPN</option><option value="0">Non-PPN</option></select></div></div><div class="row"><button class="btn" onclick="rbRes()">🔍 Cari</button><button class="btn g" onclick="print()">🖨️ Cetak</button></div></div><div class="card" id="res"></div>`};
function rbRes(){const s=$('#r1').value,a=$('#r2').value,b=$('#r3').value,j=$('#r4').value,r=db.buy.filter(x=>(!s||x.sup==s)&&x.date>=a&&x.date<=b&&(j===''||+x.ppn==j)).sort((x,y)=>x.date<y.date?-1:1);
const T1=r.reduce((z,x)=>z+sub(x),0),T2=r.reduce((z,x)=>z+ppnOf(x),0);
$('#res').innerHTML=`<b>Laporan Pembelian ${s?'– '+sn(s):'(Semua Supplier)'}</b><div class="sub">Periode ${fd(a)} s/d ${fd(b)}</div>`+list(['Tanggal','No. BP','No. Faktur','No. Faktur Pajak','Supplier','#Nilai Pembelian','#PPN','#Total'],r.map(x=>`<tr><td>${fd(x.date)}</td><td>${x.bp}</td><td>${x.inv}</td><td>${x.taxinv}</td><td>${sn(x.sup)}</td><td class="n">${fmt(sub(x))}</td><td class="n">${fmt(ppnOf(x))}</td><td class="n">${fmt(tot(x))}</td></tr>`).join(''),`<tr><td colspan="5" class="n">TOTAL</td><td class="n">${fmt(T1)}</td><td class="n">${fmt(T2)}</td><td class="n">${fmt(T1+T2)}</td></tr>`)}
/* KARTU HUTANG */
V.kh=()=>{T=T||'1';setTimeout(khRes,0);const t=T,ab=t=='1';return`<div class="tabs noprint">${[['1','Saldo Akhir Hutang'],['2','Perincian Pembayaran / Mutasi'],['3','Rekap Pembelian & Pembayaran']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="T='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
<div class="card noprint"><div class="f">${t=='2'?`<div><label>Supplier</label><select id="k1">${sopt()}</select></div>`:''}${ab?`<div><label>Per Tanggal</label><input type="date" id="k3" value="${td()}"></div>`:`<div><label>Dari</label><input type="date" id="k2" value="${td().slice(0,7)}-01"></div><div><label>Sampai</label><input type="date" id="k3" value="${td()}"></div>`}</div><div class="row"><button class="btn" onclick="khRes()">🔍 Tampilkan</button><button class="btn g" onclick="print()">🖨️ Cetak</button></div></div><div class="card" id="res"></div>`};
function khRes(){const t=T,e=$('#k3').value,a=$('#k2')?$('#k2').value:'',h=x=>`<b>${x}</b><div class="sub">`;let o='';
if(t=='1'){const r=db.sup.map(s=>({s,b:bal(s.id,e)}));o=`<b>Saldo Akhir Hutang per ${fd(e)}</b><br><br>`+list(['No. CoA','Supplier','#Saldo Akhir'],r.map(x=>`<tr><td>${x.s.coa}</td><td>${x.s.name}</td><td class="n">${fmt(x.b)}</td></tr>`).join(''),`<tr><td colspan="2" class="n">TOTAL HUTANG</td><td class="n">${fmt(r.reduce((z,x)=>z+x.b,0))}</td></tr>`)}
if(t=='2'){const s=$('#k1').value;if(!s)return $('#res').innerHTML='<div class="tip">Pilih supplier terlebih dahulu.</div>';let run=bal(s,a,1);const r=ev(s).filter(x=>x.d>=a&&x.d<=e);

const on=k=>(db.auto||{})[k]!==false;

function remind(no,h){const s=db.sale.find(x=>x.no==no);if(!s)return;const x=ar().find(y=>y.s.no==no),m=`Yth. ${s.cust}, kami mengingatkan faktur ${s.no} tanggal ${fd(s.date)} sebesar Rp ${fmt(x?x.o:tot(s))}${s.cash?'':' (jatuh tempo '+fd(dueOf(s))+')'}. Mohon konfirmasi pembayarannya. Terima kasih. – ${UN()}`;try{navigator.clipboard.writeText(m)}catch(e){}toast('📋 Pesan pengingat disalin');const u=h=='wa'?'https://wa.me/?text='+encodeURIComponent(m):'mailto:?subject='+encodeURIComponent('Pengingat Faktur '+s.no)+'&body='+encodeURIComponent(m);try{window.open(u,'_blank')}catch(e){}}
V.auto=()=>{const sw=(k,t,d)=>`<label class="step" style="display:block;cursor:pointer"><input type="checkbox" style="width:auto;float:right" ${on(k)?'checked':''} onchange="db.auto=db.auto||{};db.auto['${k}']=this.checked;save()"><b>${t}</b><br><small>${d}</small></label>`,A=ar(),t0=td();
return`<div class="tip">🤖 Berjalan otomatis tanpa input tambahan: jurnal, stok & HPP, PPN, penyusutan aktiva, dan laporan keuangan.</div><div class="steps">${sw('ap','⏰ Pengingat hutang jatuh tempo','Notifikasi 3 hari sebelum & sesudah tempo supplier')}${sw('ar','🧾 Pengingat piutang','Notifikasi tagihan pelanggan jatuh tempo')}${sw('stk','📦 Peringatan stok menipis','Muncul saat stok ≤ 5')}${sw('inv','🖨️ Faktur otomatis','Faktur terbuka otomatis setelah penjualan disimpan')}${sw('bal','⚖️ Cek neraca otomatis','Peringatan jika neraca tidak seimbang')}</div><div class="card"><div class="f"><div><label>Jatuh tempo piutang pelanggan (hari)</label><input type="number" value="${db.due||30}" onchange="db.due=+this.value||30;save();render()"></div></div><b>Piutang Belum Lunas & Pengingat</b><div style="margin-top:10px">${list(['Pelanggan','Faktur','Jatuh Tempo','#Sisa','Status','Aksi'],A.map(x=>`<tr><td>${esc(x.s.cust)}</td><td>${x.s.no}</td><td>${fd(dueOf(x.s))}</td><td class="n">${fmt(x.o)}</td><td><span class="badge ${dueOf(x.s)<t0?'b2':'b3'}">${dueOf(x.s)<t0?'Telat':'Berjalan'}</span></td><td class="row"><button class="btn g sm" onclick="invoice('${x.s.no}')">🧾 Faktur</button><button class="btn sm" onclick="remind('${x.s.no}','wa')">💬 Ingatkan</button></td></tr>`).join(''))}</div></div>`};
V.ai=()=>`<div class="card"><b>📄 Baca Faktur dengan AI</b><div class="sub" style="margin:6px 0 10px">Tempel teks faktur supplier atau pilih foto faktur — AI mengekstrak supplier, tanggal, PPN & barang.</div><textarea id="ai1" rows="6" placeholder="Tempel isi faktur di sini..."></textarea><div class="row" style="margin:10px 0"><input type="file" id="ai2" accept="image/*" style="max-width:260px"><button class="btn" onclick="aiInv()">✨ Proses dengan AI</button></div><div id="ai3"></div></div><div class="card"><b>🧠 Analisis Keuangan AI</b><div class="sub" style="margin:6px 0 10px">Minta insight dari data keuangan Anda saat ini.</div><input id="ai4" placeholder="Pertanyaan (opsional), mis. Apa risiko arus kas saya?"><div class="row" style="margin-top:10px"><button class="btn" onclick="aiAna()">✨ Analisis Sekarang</button></div><div id="ai5" style="white-space:pre-wrap;margin-top:12px"></div></div>`;
async function aiS(){if(!window.claude){toast('✨ AI aktif saat dibuka lewat link claude.ai');return null}const s=await claude.use('sample');if(!s)toast('✨ AI tidak tersedia / belum diizinkan');return s}
async function aiInv(){const s=await aiS();if(!s)return;const t=$('#ai1').value.trim(),f=$('#ai2').files[0],o=$('#ai3');if(!t&&!f)return toast('⚠️ Tempel teks atau pilih foto faktur');o.textContent='⏳ AI sedang membaca faktur...';
try{const p='Ekstrak faktur pembelian berikut menjadi JSON saja: {"supplier":string,"inv":string,"taxinv":string,"date":"YYYY-MM-DD","ppn":boolean,"items":[{"name":string,"price":number harga satuan sebelum PPN,"qty":number,"disc":number}]}. Isi kosong jika tidak ada.\n\n'+t,x=await s.json(p,f?{images:[f],cache:false}:{cache:false});window.AX=x;o.innerHTML=`<div class="tip">✅ Hasil AI — periksa dulu sebelum disimpan</div>`+list(['Barang','#Harga','#Qty'],(x.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${fmt(i.price)}</td><td class="n">${fmt(i.qty)}</td></tr>`).join(''))+`<p>Supplier: <b>${esc(x.supplier)}</b> · Faktur: <b>${esc(x.inv)}</b> · Tgl: <b>${esc(x.date)}</b> · ${x.ppn?'PPN':'Non-PPN'}</p><button class="btn" onclick="aiBuy()">🛒 Buat Pembelian dari Hasil Ini</button>`}catch(e){o.textContent='⚠️ Gagal: '+(e.message||'coba lagi')}}
function aiBuy(){const x=window.AX||{},ppn=!!x.ppn,k=ppn?'P':'N',sp=x.supplier&&db.sup.find(s=>nk(s.name)==nk(x.supplier)||nk(s.name).includes(nk(x.supplier)));P='buy';T=ppn?'ppn':'non';D={date:x.date||td(),ppn,inv:x.inv||'',taxinv:x.taxinv||'',sup:sp?String(sp.id):'',items:(x.items||[]).map(i=>({name:i.name||'',price:+i.price||0,qty:+i.qty||1,disc:+i.disc||0})),bp:nextNo(k,db.buy.filter(b=>b.bp[0]==k),'bp')};render();toast(sp?'✅ Form terisi — periksa lalu simpan':'⚠️ Supplier belum terdaftar — pilih atau tambah dulu')}
async function aiAna(){const s=await aiS();if(!s)return;const o=$('#ai5'),r=bs('0000-00-00','9999'),ry=bs(td().slice(0,4)+'-01-01','9999'),d={kasBank:net(r,'1.1.01')+net(r,'1.1.02'),piutang:net(r,'1.1.03'),persediaan:net(r,'1.1.04'),hutang:-net(r,'2.1.01'),penjualanYTD:sec(ry,'4.1',-1).sum,hppYTD:sec(ry,'5',1).sum,biayaYTD:sec(ry,'6',1).sum,labaBersihYTD:lb(ry),peringatan:alerts().map(a=>a.replace(/<[^>]+>/g,''))};
o.textContent='⏳ AI sedang menganalisis...';try{const q=$('#ai4').value.trim();await s('Anda analis keuangan UMKM Indonesia. Data (Rupiah): '+JSON.stringify(d)+'\n\n'+(q?'Pertanyaan: '+q:'Berikan 5 insight singkat dan 3 saran tindakan prioritas.')+'\nJawab dalam Bahasa Indonesia, ringkas, tanpa format markdown.',{cache:false,onText:u=>{o.textContent=u.text}})}catch(e){o.textContent='⚠️ Gagal: '+(e.message||'coba lagi')}}
function landing(){let a=$('#auth');if(!a){a=document.createElement('div');a.id='auth';document.body.appendChild(a)}a.className='ld';
const F=[['🤖','Workflow Automation','Jurnal, HPP, stok & penyusutan terjadi otomatis. Tanpa input ganda.'],['✨','AI Data Processing','Foto atau tempel faktur — AI membacanya jadi transaksi siap simpan.'],['🧾','Faktur & Pengingat Otomatis','Faktur penjualan siap cetak + pengingat piutang via WhatsApp & email.'],['☁️','Cloud & Multi-User','Tim bekerja di data yang sama, tersinkron antar perangkat.'],['⚡','Laporan Instan','Neraca, Laba Rugi & Laba Ditahan langsung jadi saat transaksi disimpan.'],['📱','Semua Perangkat','iPhone, Android, Windows & Mac. Pasang seperti aplikasi.']];
a.innerHTML=`<nav><b>💼 KLA Accounting</b><span><button class="btn g" onclick="authUI('in')">Masuk</button> <button class="btn" onclick="authUI('up')">Daftar</button></span></nav><section class="hr"><div class="bl x1"></div><div class="bl x2"></div><div><span class="pill">✨ Akuntansi pintar untuk bisnis Indonesia</span><div class="big">Akuntansi otomatis.<br>Laporan keuangan <em>instan.</em></div><p>Catat pembelian, penjualan & kas sekali — jurnal, stok, HPP, neraca dan laba rugi tersusun sendiri.</p><div class="row" style="justify-content:center"><button class="btn lg" onclick="authUI('up')">🚀 Mulai Sekarang</button><button class="btn g lg" onclick="authUI('in')">Sudah punya akun</button></div></div><div class="fc"><div class="gl"><small>Laba Bulan Ini (contoh)</small><b>+ Rp 48.250.000</b></div><div class="gl g2"><small>Kas & Bank (contoh)</small><b>Rp 312.400.000</b></div><div class="gl g3">🔔 3 faktur jatuh tempo</div></div></section><section class="fg">${F.map(f=>`<div class="ft"><span>${f[0]}</span><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('')}</section><section class="cta"><h2>Siap merapikan pembukuan Anda?</h2><button class="btn w lg" onclick="authUI('up')">Buat Akun Sekarang →</button></section>`}
boot();
</script></body></html>
